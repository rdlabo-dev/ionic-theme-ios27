name: Lint
on:
  pull_request:
    branches: [main, ios26]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, ios26]
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:esm
      - run: npm run test:packages
      - run: npm run test:release
      - run: node --test scripts/report-retention.test.mjs
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Cache Angular
        uses: actions/cache@v5
        with:
          path: demo/.angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('demo/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('demo/package-lock.json') }}-
            ${{ runner.os }}-angular-
      # The demo consumes the workspace packages, so install the root
      # dependencies and verify the package build before checking the demo.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: './demo'
      - run: npm run lint
        working-directory: './demo'
      - run: npm test -- --watch=false
        working-directory: './demo'
