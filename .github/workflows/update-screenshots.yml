name: Update E2E Screenshots

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr-metadata:
    # Only run if comment is on a PR and contains the trigger phrase
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/update-screenshots')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      base-ref: ${{ fromJson(steps.get-pr.outputs.result).baseRef }}
      base-sha: ${{ fromJson(steps.get-pr.outputs.result).baseSha }}
      head-ref: ${{ fromJson(steps.get-pr.outputs.result).ref }}
      head-repo: ${{ fromJson(steps.get-pr.outputs.result).repo }}
      head-sha: ${{ fromJson(steps.get-pr.outputs.result).sha }}
      authorized: ${{ fromJson(steps.get-pr.outputs.result).authorized }}
      same-repository: ${{ fromJson(steps.get-pr.outputs.result).sameRepository }}
    steps:
      - name: Get PR metadata and verify permission
        uses: actions/github-script@v7
        id: get-pr
        with:
          script: |
            const [pr, permission] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              }),
              github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login
              })
            ]);
            const supportedBase = ['main', 'ios26'].includes(pr.data.base.ref);
            const authorized = supportedBase && ['admin', 'maintain', 'write'].includes(permission.data.permission);
            return {
              baseRef: pr.data.base.ref,
              baseSha: pr.data.base.sha,
              ref: pr.data.head.ref,
              sha: pr.data.head.sha,
              repo: pr.data.head.repo.full_name,
              authorized,
              sameRepository: pr.data.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
            };

      - name: Add reaction to authorized comment
        if: fromJson(steps.get-pr.outputs.result).authorized
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

  update-screenshots:
    needs: pr-metadata
    if: >-
      needs.pr-metadata.outputs.authorized == 'true' &&
      needs.pr-metadata.outputs.same-repository == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.pr-metadata.outputs.head-repo }}
          ref: ${{ needs.pr-metadata.outputs.head-sha }}
          persist-credentials: false

      - name: Checkout base-branch screenshot updater
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.pr-metadata.outputs.base-sha }}
          path: .base-branch
          persist-credentials: false

      - name: Fix git safe directory
        run: git config --system --add safe.directory $GITHUB_WORKSPACE

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Update screenshots using base-branch procedure
        run: bash .base-branch/.github/scripts/update-e2e-screenshots.sh

      - name: Upload updated screenshots
        uses: actions/upload-artifact@v5
        with:
          name: updated-screenshots
          path: |
            demo/e2e/screenshot.spec.ts-snapshots/*.png
            demo/e2e/adaptive-tab-bar.spec.ts-snapshots/*.png
          if-no-files-found: error

  commit-screenshots:
    needs: [pr-metadata, update-screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download updated screenshots
        uses: actions/download-artifact@v5
        with:
          name: updated-screenshots
          path: updated-screenshots

      - name: Commit screenshots through the GitHub API
        id: commit
        uses: actions/github-script@v7
        env:
          EXPECTED_BASE_REF: ${{ needs.pr-metadata.outputs.base-ref }}
          EXPECTED_BASE_SHA: ${{ needs.pr-metadata.outputs.base-sha }}
          EXPECTED_HEAD_REF: ${{ needs.pr-metadata.outputs.head-ref }}
          EXPECTED_HEAD_REPO: ${{ needs.pr-metadata.outputs.head-repo }}
          EXPECTED_HEAD_SHA: ${{ needs.pr-metadata.outputs.head-sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const snapshotPrefix = 'demo/e2e';
            const snapshotDirectories = ['screenshot.spec.ts-snapshots'];
            if (process.env.EXPECTED_BASE_REF === 'main') snapshotDirectories.push('adaptive-tab-bar.spec.ts-snapshots');
            const artifactDirectory = 'updated-screenshots';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            const expectedHeadRef = process.env.EXPECTED_HEAD_REF;
            const expectedHeadRepo = process.env.EXPECTED_HEAD_REPO;
            const expectedBaseRef = process.env.EXPECTED_BASE_REF;
            const expectedBaseSha = process.env.EXPECTED_BASE_SHA;

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            if (
              pr.data.head.repo.full_name !== expectedHeadRepo ||
              pr.data.head.ref !== expectedHeadRef ||
              pr.data.head.sha !== expectedHeadSha ||
              pr.data.base.ref !== expectedBaseRef ||
              pr.data.base.sha !== expectedBaseSha
            ) {
              core.setFailed('The PR head or base changed while screenshots were being generated. Run /update-screenshots again.');
              return;
            }

            const directories = fs.readdirSync(artifactDirectory).sort();
            if (directories.join('\n') !== [...snapshotDirectories].sort().join('\n')) {
              core.setFailed('The screenshot artifact contains missing or unexpected directories.');
              return;
            }
            const filenames = [];
            for (const directory of directories) {
              const files = fs.readdirSync(path.join(artifactDirectory, directory)).sort();
              if (files.length === 0 || files.some((filename) => !/^[A-Za-z0-9._-]+\.png$/.test(filename))) {
                core.setFailed('The screenshot artifact contains missing or unexpected files.');
                return;
              }
              filenames.push(...files.map((filename) => `${directory}/${filename}`));
            }

            const commit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: expectedHeadSha
            });
            const currentTree = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: commit.data.tree.sha,
              recursive: 'true'
            });
            const uploadedPaths = new Set(
              filenames.map((filename) => `${snapshotPrefix}/${filename}`)
            );
            const tree = currentTree.data.tree
              .filter((entry) =>
                entry.type === 'blob' &&
                snapshotDirectories.some((directory) => entry.path.startsWith(`${snapshotPrefix}/${directory}/`)) &&
                !uploadedPaths.has(entry.path)
              )
              .map((entry) => ({ path: entry.path, mode: '100644', type: 'blob', sha: null }));

            for (const filename of filenames) {
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: fs.readFileSync(path.join(artifactDirectory, filename)).toString('base64'),
                encoding: 'base64'
              });
              tree.push({
                path: `${snapshotPrefix}/${filename}`,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha
              });
            }

            const updatedTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: commit.data.tree.sha,
              tree
            });
            if (updatedTree.data.sha === commit.data.tree.sha) {
              core.setOutput('has-changes', 'false');
              return;
            }

            const updatedCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore: update E2E screenshots',
              tree: updatedTree.data.sha,
              parents: [expectedHeadSha],
              author: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com'
              }
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${expectedHeadRef}`,
              sha: updatedCommit.data.sha,
              force: false
            });
            core.setOutput('has-changes', 'true');

      - name: Comment success
        if: steps.commit.outputs.has-changes == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ Screenshots have been updated successfully!

            The new screenshots have been committed to this PR.

      - name: Comment no changes
        if: steps.commit.outputs.has-changes == 'false'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ℹ️ No screenshot changes detected.

            The current screenshots are already up to date.

  comment-fork:
    needs: pr-metadata
    if: >-
      needs.pr-metadata.outputs.authorized == 'true' &&
      needs.pr-metadata.outputs.same-repository != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Explain unsupported fork update
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⚠️ Screenshots cannot be updated automatically on a fork PR.

            Push the branch to this repository or update the screenshots locally.

  comment-failure:
    needs: [pr-metadata, update-screenshots, commit-screenshots]
    if: >-
      always() &&
      needs.pr-metadata.result == 'success' &&
      (needs.update-screenshots.result == 'failure' || needs.commit-screenshots.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment failure
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ Failed to update screenshots.

            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
