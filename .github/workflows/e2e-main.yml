name: E2E Screenshot Tests

on:
  push:
    branches:
      - main
      - ios26
jobs:
  test:
    if: "${{ (needs.ci-reuse.result != 'success' && !cancelled()) || ((success()) && needs.ci-reuse.outputs.reuse != 'true') }}"
    needs:
      - ci-reuse
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Fail if tree verification failed
        if: needs.ci-reuse.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - run: npm ci --no-audit --no-fund
        working-directory: './demo'
      - name: Run Playwright tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        working-directory: ./demo
        env:
          IONIC_MAJOR: 9

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-ionic9-${{ matrix.shard }}
          path: demo/playwright-report/
          overwrite: true
          retention-days: 3

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-ionic9-${{ matrix.shard }}
          path: demo/test-results/
          overwrite: true
          retention-days: 3

  ci-reuse:
    name: Verify tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test CI reuse guards
        run: node --test .github/scripts/ci-tree-reuse.test.mjs
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
      - name: Reuse only the latest successful PR CI for this tree
        id: lookup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            const { resolveReuse } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            const result = await resolveReuse(github, context, process.env.TREE, 'e2e-pull_request.yml');
            core.setOutput('reuse', String(result.reuse));
            if (result.reuse) {
              await core.summary.addHeading('Reused PR validation').addLink('Latest successful PR CI', result.url)
                .addRaw(`\n\nComplete repository tree: ${result.tree}\n`).write();
            } else {
              core.info(result.reason);
            }
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
      - ci-reuse
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require executed tests or verified reuse
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          NEEDS: ${{ toJSON(needs) }}
          REUSE: ${{ needs.ci-reuse.outputs.reuse }}
        with:
          script: |
            const { requireResults } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            requireResults(process.env.REUSE === 'true', JSON.parse(process.env.NEEDS), ["test"], []);
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
      - name: Record PR checkout evidence
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-tree-pr-${{ github.event.pull_request.number }}-${{ steps.tree.outputs.tree }}-${{ steps.tree.outputs.commit
            }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree.txt
          if-no-files-found: error
          retention-days: 30
