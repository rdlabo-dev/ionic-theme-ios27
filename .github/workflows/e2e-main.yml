name: E2E Screenshot Tests

on:
  push:
    branches:
      - main
      - ios26
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        ionic-major: [8, 9]
        include:
          - ionic-major: 8
            ionic-version: 8.8.19
            eslint-plugin-version: 21.3.0
          - ionic-major: 9
            ionic-version: 9.0.0
            eslint-plugin-version: 22.1.0
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund
      - if: matrix.ionic-major == 8
        run: npm install --no-save --package-lock=false --no-audit --no-fund @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }}
      - run: npm run build

      - run: npm ci --no-audit --no-fund
        working-directory: './demo'
      - name: Install matching Ionic and ESLint plugin versions
        run: npm install --no-save --package-lock=false --no-audit --no-fund @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }} @rdlabo/eslint-plugin-rules@${{ matrix.eslint-plugin-version }}
        working-directory: './demo'

      - name: Run Playwright tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        working-directory: ./demo
        env:
          IONIC_MAJOR: ${{ matrix.ionic-major }}

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-ionic${{ matrix.ionic-major }}-${{ matrix.shard }}
          path: demo/playwright-report/
          overwrite: true
          retention-days: 3

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-ionic${{ matrix.ionic-major }}-${{ matrix.shard }}
          path: demo/test-results/
          overwrite: true
          retention-days: 3
