name: Native UI Kit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @rdlabo/capacitor-native-ui-kit
      - run: npm exec --workspace @rdlabo/capacitor-native-ui-kit -- playwright install --with-deps chromium
      - run: npm test --workspace @rdlabo/capacitor-native-ui-kit
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bash scripts/verify-kit-spm.sh
      - name: Test on an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -scheme CapacitorNativeUIKit -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Android library, Maven resolution and Compose consumer
        run: sh scripts/verify-native-ui-kit-android.sh
      - uses: actions/upload-artifact@v5
        with:
          name: native-ui-kit-maven
          path: packages/capacitor-native-ui-kit/android/build/maven
          if-no-files-found: error
