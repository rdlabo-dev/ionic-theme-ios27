name: Release

on:
  push:
    tags:
      - 'ios27-v*'
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - Lint
      - E2E Screenshot Tests
      - Package Candidate
    types: [completed]

permissions:
  contents: read

jobs:
  beta-reaction:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/beta'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check owner or maintainer permission
        id: permission
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              return { authorized: ['admin', 'maintain'].includes(data.permission) };
            } catch (error) {
              core.warning(`Could not verify beta comment permission: ${error.message}`);
              return { authorized: false };
            }

      - name: Add reaction to authorized beta comment
        if: fromJson(steps.permission.outputs.result).authorized
        uses: peter-evans/create-or-update-comment@v5
        continue-on-error: true
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-ios27-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Update npm
        run: npm install -g npm@latest

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#ios27-v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Verify root version matches release tag
        env:
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.match(process.env.VERSION, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(JSON.parse(readFileSync('package.json', 'utf8')).version, process.env.VERSION);
          JS

      - name: Install dependencies
        run: npm ci

      - name: Update all workspace versions
        env:
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          npm version "$VERSION" --workspaces --no-git-tag-version --ignore-scripts --allow-same-version
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('demo/package-lock.json', 'utf8'));
          for (const path of ['packages/capacitor-native-ui', 'packages/theme-ios27']) {
            lock.packages[`../${path}`].version = process.env.VERSION;
          }
          writeFileSync('demo/package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          JS

      - name: Verify package version matches release tag
        env:
          TAG_VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const paths = ['package.json', 'packages/capacitor-native-ui/package.json', 'packages/theme-ios27/package.json'];
          const packages = paths.map(path => JSON.parse(readFileSync(path, 'utf8')));
          for (const pkg of packages) assert.equal(pkg.version, process.env.TAG_VERSION, `${pkg.name}: release version mismatch`);
          assert.equal(packages[2].dependencies[packages[1].name], 'file:../capacitor-native-ui', 'Native workspace dependency mismatch');
          JS

      - name: Build workspaces
        run: npm run build

      - name: Pack release archives
        run: node scripts/pack-packages.mjs --pack-destination "$RUNNER_TEMP/npm-release"

      - name: Commit workspace versions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package-lock.json demo/package-lock.json packages/*/package.json
          if git diff --cached --quiet; then
            echo "Workspace versions are already current."
          else
            git commit -m "chore: update workspace versions to $VERSION"
          fi
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "origin/$DEFAULT_BRANCH^{tree}")" ]; then
            echo "The default branch already contains the same release tree."
          else
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Publish packages
        env:
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const version = process.env.VERSION;
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          const tag = version.includes('-') ? 'next' : 'latest';
          const pending = [];
          // Validate both archives and registry versions before publishing either package.
          for (const name of ['capacitor-native-ui', 'ionic-theme-ios27']) {
            const spec = `@rdlabo/${name}@${version}`;
            const archive = `${process.env.RUNNER_TEMP}/npm-release/rdlabo-${name}-${version}.tgz`;
            const pkg = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }));
            assert.equal(pkg.name, `@rdlabo/${name}`, 'Unexpected package identity');
            assert.equal(pkg.version, version, 'Artifact version mismatch');
            assert(!pkg.publishConfig?.registry || ['https://registry.npmjs.org', 'https://registry.npmjs.org/'].includes(pkg.publishConfig.registry), 'Unexpected publish registry');
            if (name === 'ionic-theme-ios27') assert.equal(pkg.dependencies?.['@rdlabo/capacitor-native-ui'], version, 'Native dependency version mismatch');
            const existing = spawnSync('npm', ['view', spec, 'dist.integrity', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
            if (existing.status === 0) {
              const integrity = 'sha512-' + createHash('sha512').update(readFileSync(archive)).digest('base64');
              assert.equal(JSON.parse(existing.stdout), integrity, `${spec} already exists with different contents`);
              console.log(`${spec} already published with matching contents; skipping.`);
              continue;
            }
            let error;
            try { error = JSON.parse(existing.stdout).error; } catch {}
            assert.equal(error?.code, 'E404', `Cannot check ${spec}: ${existing.stderr}`);
            pending.push(archive);
          }
          // The theme's exact-version dependency must be available first.
          for (const archive of pending) {
            execFileSync('npm', ['publish', archive, '--ignore-scripts', '--provenance', '--access', 'public',
              '--registry=https://registry.npmjs.org', '--tag', tag], { stdio: 'inherit' });
          }
          JS

  authorize-candidate:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/beta') ||
      (github.event_name == 'workflow_run' &&
      github.event.action == 'completed')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      artifact: ${{ steps.gate.outputs.artifact }}
      dist-tag: ${{ steps.gate.outputs.dist-tag }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      package: ${{ steps.gate.outputs.package }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      run-id: ${{ steps.gate.outputs.run-id }}
      version: ${{ steps.gate.outputs.version }}
      source-kind: ${{ steps.gate.outputs.source-kind }}
      target-branch: ${{ steps.gate.outputs.target-branch }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Authorize immutable candidate
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const supportedBranches = new Set(['main', 'ios26']);
            const isComment = context.eventName === 'issue_comment';
            const protectedWorkflows = [
              '.github/workflows/lint.yml',
              '.github/workflows/e2e-pull_request.yml',
              '.github/workflows/e2e-main.yml',
              '.github/workflows/package-candidate.yml',
              '.github/workflows/release.yml',
            ];
            const tryCreateComment = async (body) => {
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(context.issue.number),
                  body,
                });
              } catch (error) {
                core.warning(`Could not post the beta gate comment: ${error.message}`);
              }
            };

            const getTrustedPackage = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'package.json',
                ref,
              });
              if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                throw new Error(`package.json is not a file at ${ref}`);
              }
              const packageJson = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              return {
                name: ref === 'main' ? '@rdlabo/ionic-theme-ios27' : packageJson.name,
                baseVersion: packageJson.version.split('-')[0],
              };
            };

            const getRequiredRuns = async (headSha, event, required, prNumber, targetBranch) => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: headSha,
                event,
                per_page: 100,
              });
              const latest = new Map();
              for (const [name, path] of required) {
                const run = runs
                  .filter((candidate) =>
                    candidate.name === name &&
                    candidate.path === path &&
                    (event === 'pull_request'
                      ? candidate.pull_requests?.some((pullRequest) =>
                          String(pullRequest.number) === prNumber &&
                          pullRequest.base?.ref === targetBranch &&
                          pullRequest.head?.sha === headSha
                        )
                      : candidate.head_branch === targetBranch)
                  )
                  .sort((left, right) => right.run_number - left.run_number)[0];
                latest.set(name, run);
              }
              return latest;
            };

            let headSha;
            let prNumber = '';
            let distTag;
            let required;
            let event;
            let sourceKind;
            let targetBranch;

            if (isComment) {
              const requester = context.payload.comment.user.login;
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: requester,
              });
              if (!['admin', 'maintain'].includes(permission.permission)) {
                core.notice(`@${requester} is not a repository owner or maintainer; /beta was ignored.`);
                core.setOutput('allowed', 'false');
                return;
              }

              prNumber = String(context.payload.issue.number);
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(prNumber),
              });
              if (pullRequest.state !== 'open' || pullRequest.draft) {
                core.notice('The PR must be open and ready for review.');
                core.setOutput('allowed', 'false');
                return;
              }
              if (!pullRequest.head.repo) {
                core.setFailed('The pull request head repository is no longer available.');
                return;
              }
              targetBranch = pullRequest.base.ref;
              if (!supportedBranches.has(targetBranch)) {
                core.notice(`Beta publishing is not enabled for the ${targetBranch} branch.`);
                core.setOutput('allowed', 'false');
                return;
              }
              const changedWorkflows = [];
              for (const path of protectedWorkflows) {
                const [{ data: trusted }, { data: candidate }] = await Promise.all([
                  github.rest.repos.getContent({ owner, repo, path, ref: targetBranch }),
                  github.rest.repos.getContent({
                    owner: pullRequest.head.repo.owner.login,
                    repo: pullRequest.head.repo.name,
                    path,
                    ref: pullRequest.head.sha,
                  }),
                ]);
                if (Array.isArray(trusted) || Array.isArray(candidate) || trusted.sha !== candidate.sha) {
                  changedWorkflows.push(path);
                }
              }
              if (changedWorkflows.length > 0) {
                const body = `🚫 \`/beta\` cannot publish a pull request that changes a release-gating workflow: ${changedWorkflows.join(', ')}.`;
                await tryCreateComment(body);
                core.setOutput('allowed', 'false');
                return;
              }
              headSha = pullRequest.head.sha;
              distTag = 'beta';
              event = 'pull_request';
              sourceKind = 'comment';
              required = new Map([
                ['Lint', '.github/workflows/lint.yml'],
                ['E2E Screenshot Tests Pull Request', '.github/workflows/e2e-pull_request.yml'],
                ['Package Candidate', '.github/workflows/package-candidate.yml'],
              ]);
            } else {
              const source = context.payload.workflow_run;
              targetBranch = source.head_branch;
              if (
                source.event !== 'push' ||
                !supportedBranches.has(targetBranch) ||
                source.conclusion !== 'success'
              ) {
                core.notice('This workflow run is not a successful supported-branch push.');
                core.setOutput('allowed', 'false');
                return;
              }
              headSha = source.head_sha;
              const { data: branch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: targetBranch,
              });
              if (branch.commit.sha !== headSha) {
                core.notice('A newer target-branch commit exists; the stale candidate was skipped.');
                core.setOutput('allowed', 'false');
                return;
              }
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              const mergedPullRequest = pullRequests.find(
                (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === targetBranch &&
                  pullRequest.merge_commit_sha === headSha,
              );
              if (!mergedPullRequest) {
                core.notice('The target-branch push is not a merged pull request; no beta release was requested.');
                core.setOutput('allowed', 'false');
                return;
              }
              prNumber = String(mergedPullRequest.number);
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: mergedPullRequest.number,
                per_page: 100,
              });
              const changedWorkflows = changedFiles
                .map((file) => file.filename)
                .filter((filename) => protectedWorkflows.includes(filename));
              if (changedWorkflows.length > 0) {
                core.notice(`The merged pull request changed a release-gating workflow; beta was skipped: ${changedWorkflows.join(', ')}`);
                core.setOutput('allowed', 'false');
                return;
              }
              distTag = 'beta';
              event = 'push';
              sourceKind = 'merge';
              required = new Map([
                ['Lint', '.github/workflows/lint.yml'],
                ['E2E Screenshot Tests', '.github/workflows/e2e-main.yml'],
                ['Package Candidate', '.github/workflows/package-candidate.yml'],
              ]);
            }

            const runs = await getRequiredRuns(headSha, event, required, prNumber, targetBranch);
            const incomplete = [...required.keys()].filter((name) => {
              const run = runs.get(name);
              return !run || run.status !== 'completed' || run.conclusion !== 'success';
            });
            if (incomplete.length > 0) {
              if (isComment) {
                const body = `🚫 \`/beta\` did not publish commit \`${headSha.slice(0, 12)}\`. Required CI has not passed: ${incomplete.join(', ')}. Run \`/beta\` again after CI succeeds.`;
                await tryCreateComment(body);
              }
              core.notice(`Required CI has not passed: ${incomplete.join(', ')}`);
              core.setOutput('allowed', 'false');
              return;
            }

            const candidateRun = runs.get('Package Candidate');
            const artifactName = `npm-candidate-${headSha}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: candidateRun.id,
              per_page: 100,
            });
            const artifact = artifacts.find(
              (candidate) => candidate.name === artifactName && !candidate.expired,
            );
            if (!artifact) {
              core.setFailed(`The immutable package artifact ${artifactName} is missing or expired.`);
              return;
            }

            const trustedPackage = await getTrustedPackage(targetBranch);
            const version = `${trustedPackage.baseVersion}-beta.pr${prNumber}.sha${headSha.slice(0, 12)}`;

            core.setOutput('allowed', 'true');
            core.setOutput('artifact', artifactName);
            core.setOutput('dist-tag', distTag);
            core.setOutput('head-sha', headSha);
            core.setOutput('package', trustedPackage.name);
            core.setOutput('pr-number', prNumber);
            core.setOutput('run-id', String(candidateRun.id));
            core.setOutput('version', version);
            core.setOutput('source-kind', sourceKind);
            core.setOutput('target-branch', targetBranch);

  publish-candidate:
    needs: authorize-candidate
    if: needs.authorize-candidate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-${{ needs.authorize-candidate.outputs.target-branch }}-${{ needs.authorize-candidate.outputs.dist-tag }}
      cancel-in-progress: false
    env:
      NPM_CONFIG_TAG: ${{ needs.authorize-candidate.outputs.dist-tag }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Revalidate authorization and source
        uses: actions/github-script@v8
        env:
          DIST_TAG: ${{ needs.authorize-candidate.outputs.dist-tag }}
          HEAD_SHA: ${{ needs.authorize-candidate.outputs.head-sha }}
          PACKAGE_NAME: ${{ needs.authorize-candidate.outputs.package }}
          PR_NUMBER: ${{ needs.authorize-candidate.outputs.pr-number }}
          RUN_ID: ${{ needs.authorize-candidate.outputs.run-id }}
          SOURCE_KIND: ${{ needs.authorize-candidate.outputs.source-kind }}
          TARGET_BRANCH: ${{ needs.authorize-candidate.outputs.target-branch }}
          VERSION: ${{ needs.authorize-candidate.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetBranch = process.env.TARGET_BRANCH;
            if (!['main', 'ios26'].includes(targetBranch)) {
              core.setFailed(`Unsupported target branch: ${targetBranch}`);
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: Number(process.env.RUN_ID),
            });
            const expectedEvent = process.env.SOURCE_KIND === 'comment' ? 'pull_request' : 'push';
            if (
              run.name !== 'Package Candidate' ||
              run.path !== '.github/workflows/package-candidate.yml' ||
              run.event !== expectedEvent ||
              run.head_sha !== process.env.HEAD_SHA ||
              run.status !== 'completed' ||
              run.conclusion !== 'success'
            ) {
              core.setFailed('The package artifact no longer has an authorized successful source run.');
              return;
            }

            if (process.env.SOURCE_KIND === 'comment') {
              const pull_number = Number(process.env.PR_NUMBER);
              const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.head.sha !== process.env.HEAD_SHA ||
                pullRequest.base.ref !== targetBranch
              ) {
                core.setFailed('The PR head or base changed after /beta; a fresh owner or maintainer /beta is required.');
                return;
              }
              const requester = context.payload.comment.user.login;
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: requester,
              });
              if (!['admin', 'maintain'].includes(permission.permission)) {
                core.setFailed(`@${requester} is no longer a repository owner or maintainer.`);
                return;
              }
            } else if (process.env.SOURCE_KIND === 'merge') {
              const { data: branch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: targetBranch,
              });
              if (branch.commit.sha !== process.env.HEAD_SHA) {
                core.setFailed('A newer target-branch commit exists; refusing to publish a stale merge candidate.');
                return;
              }
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: process.env.HEAD_SHA,
              });
              const mergedPullRequest = pullRequests.find(
                (pullRequest) => pullRequest.number === Number(process.env.PR_NUMBER) &&
                  pullRequest.merged_at && pullRequest.base.ref === targetBranch &&
                  pullRequest.merge_commit_sha === process.env.HEAD_SHA,
              );
              if (!mergedPullRequest) {
                core.setFailed('The candidate is not the merge commit of the authorized pull request.');
                return;
              }
            } else {
              core.setFailed(`Unsupported candidate source: ${process.env.SOURCE_KIND}`);
              return;
            }

            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'package.json',
              ref: targetBranch,
            });
            if (Array.isArray(data) || data.type !== 'file' || !data.content) {
              core.setFailed('Trusted package.json could not be read.');
              return;
            }
            const packageJson = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            const baseVersion = packageJson.version.split('-')[0];
            const expectedVersion = `${baseVersion}-beta.pr${process.env.PR_NUMBER}.sha${process.env.HEAD_SHA.slice(0, 12)}`;
            if (
              (targetBranch === 'main' ? '@rdlabo/ionic-theme-ios27' : packageJson.name) !== process.env.PACKAGE_NAME ||
              expectedVersion !== process.env.VERSION
            ) {
              core.setFailed('Trusted package identity changed after authorization; rerun the release request.');
            }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Download immutable package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.authorize-candidate.outputs.artifact }}
          path: ${{ runner.temp }}/npm-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-candidate.outputs.run-id }}

      - name: Validate and publish candidate
        env:
          EXPECTED_NAME: ${{ needs.authorize-candidate.outputs.package }}
          EXPECTED_VERSION: ${{ needs.authorize-candidate.outputs.version }}
          DIST_TAG: ${{ needs.authorize-candidate.outputs.dist-tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const native = '@rdlabo/capacitor-native-ui';
          const theme = '@rdlabo/ionic-theme-ios27';
          const { EXPECTED_NAME, EXPECTED_VERSION, DIST_TAG, RUNNER_TEMP } = process.env;
          assert([theme, '@rdlabo/ionic-theme-ios26'].includes(EXPECTED_NAME), 'Unexpected package identity');
          assert.equal(DIST_TAG, 'beta', 'Unexpected dist-tag');
          const names = EXPECTED_NAME === theme ? [native, theme] : [EXPECTED_NAME];
          const directory = `${RUNNER_TEMP}/npm-candidate`;
          const files = readdirSync(directory).filter(file => file.endsWith('.tgz'));
          assert.equal(files.length, names.length, 'Unexpected number of package archives');
          const archives = new Map();
          // Validate all artifacts before publishing. Never execute artifact scripts.
          for (const file of files) {
            const archive = `${directory}/${file}`;
            const pkg = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }));
            assert(names.includes(pkg.name), 'Unexpected package identity');
            assert.equal(pkg.version, EXPECTED_VERSION, 'Artifact version mismatch');
            assert(!pkg.publishConfig?.registry || ['https://registry.npmjs.org', 'https://registry.npmjs.org/'].includes(pkg.publishConfig.registry), 'Unexpected publish registry');
            if (pkg.name === theme) assert.equal(pkg.dependencies?.[native], EXPECTED_VERSION, 'Native dependency version mismatch');
            assert(!archives.has(pkg.name), 'Duplicate package identity');
            archives.set(pkg.name, archive);
          }
          const pending = [];
          for (const name of names) {
            const spec = `${name}@${EXPECTED_VERSION}`;
            const archive = archives.get(name);
            const existing = spawnSync('npm', ['view', spec, 'dist.integrity', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
            if (existing.status === 0) {
              const integrity = 'sha512-' + createHash('sha512').update(readFileSync(archive)).digest('base64');
              assert.equal(JSON.parse(existing.stdout), integrity, `${spec} already exists with different contents`);
              console.log(`${spec} already published with matching contents; skipping.`);
              continue;
            }
            let error;
            try { error = JSON.parse(existing.stdout).error; } catch {}
            assert.equal(error?.code, 'E404', `Cannot check ${spec}: ${existing.stderr}`);
            pending.push(archive);
          }
          for (const archive of pending) {
            execFileSync('npm', ['publish', archive, '--ignore-scripts', '--provenance', '--access', 'public',
              '--registry=https://registry.npmjs.org', '--tag', DIST_TAG], { stdio: 'inherit' });
          }
          JS

  comment-candidate:
    needs: [authorize-candidate, publish-candidate]
    if: >-
      always() &&
      needs.authorize-candidate.outputs.allowed == 'true' &&
      needs.publish-candidate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-comment-${{ needs.authorize-candidate.outputs.head-sha }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment exact install command
        uses: actions/github-script@v8
        env:
          DIST_TAG: ${{ needs.authorize-candidate.outputs.dist-tag }}
          HEAD_SHA: ${{ needs.authorize-candidate.outputs.head-sha }}
          PACKAGE_NAME: ${{ needs.authorize-candidate.outputs.package }}
          PR_NUMBER: ${{ needs.authorize-candidate.outputs.pr-number }}
          SOURCE_KIND: ${{ needs.authorize-candidate.outputs.source-kind }}
          VERSION: ${{ needs.authorize-candidate.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const shortSha = process.env.HEAD_SHA.slice(0, 12);
            const issueNumber = Number(process.env.PR_NUMBER);
            const marker = `<!-- npm-${process.env.DIST_TAG}:${process.env.HEAD_SHA} -->`;
            const title = 'npm beta published';
            const authorization = process.env.SOURCE_KIND === 'comment'
              ? `CI passed and a repository owner or maintainer requested \`/beta\` for commit \`${shortSha}\``
              : `CI passed for the merge commit \`${shortSha}\``;
            const install = [process.env.PACKAGE_NAME];
            if (process.env.PACKAGE_NAME === '@rdlabo/ionic-theme-ios27') install.push('@rdlabo/capacitor-native-ui');
            const installCommand = install.map(name => `${name}@${process.env.VERSION}`).join(' ');
            const body = `${marker}\n### ${title}\n\n${authorization}. Install the immutable version with:\n\n\`\`\`sh\nnpm install ${installCommand}\n\`\`\``;
            await core.summary.addRaw(body).write();
            if (!issueNumber) {
              core.notice('No associated merged pull request was found; wrote the install command to the job summary only.');
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              }
            } catch (error) {
              core.warning(`Could not post the beta install comment: ${error.message}`);
            }
