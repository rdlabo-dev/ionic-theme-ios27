name: E2E Screenshot Tests Pull Request

on:
  pull_request:
    branches:
      - main
      - ios26
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    concurrency:
      group: e2e-pr-${{ github.event.pull_request.number }}-ionic${{ matrix.ionic-major }}-${{ matrix.shard }}
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - ionic-major: 8
            ionic-version: 8.8.19
            eslint-plugin-version: 21.3.0
            shard: 1
            shards: 1
          - ionic-major: 9
            ionic-version: 9.0.0
            eslint-plugin-version: 22.1.0
            shard: 1
            shards: 2
          - ionic-major: 9
            ionic-version: 9.0.0
            eslint-plugin-version: 22.1.0
            shard: 2
            shards: 2
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund
      - if: matrix.ionic-major == 8
        run: npm install --no-save --package-lock=false --no-audit --no-fund @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }}
      - run: npm run build

      - run: npm ci --no-audit --no-fund
        working-directory: './demo'
      - name: Install matching Ionic and ESLint plugin versions
        run: npm install --no-save --package-lock=false --no-audit --no-fund @ionic/angular@${{ matrix.ionic-version }} @ionic/core@${{ matrix.ionic-version }} @rdlabo/eslint-plugin-rules@${{ matrix.eslint-plugin-version }}
        working-directory: './demo'

      - name: Run Playwright tests
        run: |
          if [ "${{ matrix.ionic-major }}" = "8" ]; then
            PLAYWRIGHT_JSON_OUTPUT_NAME=e2e/screenshot.spec.ts-ionic8.json npm run test:e2e:visual -- --reporter=json,html
          else
            npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=blob
          fi
        working-directory: ./demo
        env:
          IONIC_MAJOR: ${{ matrix.ionic-major }}

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always() && matrix.ionic-major == 8
        with:
          name: playwright-report-ionic${{ matrix.ionic-major }}
          path: demo/playwright-report/
          overwrite: true
          retention-days: 3

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-ionic${{ matrix.ionic-major }}-${{ matrix.shard }}
          path: demo/test-results/
          overwrite: true
          retention-days: 3

      - name: Upload Ionic 9 shard report
        uses: actions/upload-artifact@v5
        if: always() && matrix.ionic-major == 9
        with:
          name: blob-report-ionic9-${{ matrix.shard }}
          path: demo/blob-report/
          overwrite: true
          retention-days: 3

  merge-reports:
    needs: test
    if: "!cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download Ionic 9 shards
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-ionic9-*
          merge-multiple: true
          path: blob-reports
      - name: Merge complete Ionic 9 results
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report/screenshot.spec.ts-ionic9.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          test "$(find blob-reports -name '*.zip' | wc -l)" -eq 2
          npm exec --yes --package=@playwright/test@1.58.2 -- playwright merge-reports --reporter=html,json blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-ionic9
          path: playwright-report/
          overwrite: true
          retention-days: 3
      - name: Upload merged JSON report
        uses: actions/upload-artifact@v5
        with:
          name: json-report-${{ github.event.pull_request.number }}
          path: report/screenshot.spec.ts-ionic9.json
          overwrite: true
          retention-days: 3

  comment-results:
    needs: merge-reports
    if: >-
      !cancelled() &&
      needs.merge-reports.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download JSON report
        uses: actions/download-artifact@v5
        with:
          name: json-report-${{ github.event.pull_request.number }}
          path: report

      - name: Comment PR with Ionic 9 test results
        uses: daun/playwright-report-comment@v3
        with:
          report-file: report/screenshot.spec.ts-ionic9.json
          job-summary: true
          custom-info: 'This detailed result covers Ionic 9 only. Ionic 8 runs against the same screenshots in a separate matrix job; check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for both results. To update the screenshots, comment with `/update-screenshots`.'

  deploy-report:
    needs: [test, merge-reports]
    concurrency:
      group: playwright-gh-pages
      cancel-in-progress: false
    if: >-
      !cancelled() &&
      (github.event.action == 'closed' || needs.merge-reports.result == 'success') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prune closed PR reports and check current head
        id: reports
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const openPulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const openNumbers = new Set(openPulls.map(pull => String(pull.number)));
            for (const entry of fs.readdirSync('gh-pages', { withFileTypes: true })) {
              const match = /^pr-(\d+)$/.exec(entry.name);
              if (entry.isDirectory() && match && !openNumbers.has(match[1])) {
                fs.rmSync(`gh-pages/${entry.name}`, { recursive: true });
                core.info(`Removed closed PR report: ${entry.name}`);
              }
            }
            const current = openPulls.find(pull => pull.number === context.payload.pull_request.number);
            core.setOutput('publish', context.payload.action !== 'closed' &&
              current?.head.sha === context.payload.pull_request.head.sha);

      - name: Download HTML report
        if: steps.reports.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: playwright-report-ionic9
          path: playwright-report

      - name: Replace current PR report
        if: steps.reports.outputs.publish == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf "gh-pages/pr-$PR_NUMBER"
          mkdir -p "gh-pages/pr-$PR_NUMBER"
          cp -R playwright-report/. "gh-pages/pr-$PR_NUMBER/"

      - name: Deploy reports and deletions to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Refresh open PR test reports'

      - name: Comment PR with report link
        if: steps.reports.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${prNumber}/`;

            const marker = '<!-- ionic9-playwright-report -->';
            const body = `${marker}\n` + `📊 **Ionic 9 Playwright Test Report**\n\nView the detailed Ionic 9 report after GitHub Pages deployment completes: ${reportUrl}\n\nIonic 8 runs against the same screenshots in a separate matrix job. View both results in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber
            });
            const reports = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.startsWith('📊 **Ionic 9 Playwright Test Report**'))
            );
            if (reports.length > 0) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: reports[0].id,
                body
              });
              for (const duplicate of reports.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: duplicate.id
                });
              }
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body
              });
            }
