name: E2E Screenshot Tests Pull Request

on:
  pull_request:
    branches:
      - main
      - ios26
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    needs:
      - ci-reuse
    if: "${{ (needs.ci-reuse.result != 'success' && !cancelled()) || ((github.event.action != 'closed') && needs.ci-reuse.outputs.reuse != 'true') }}"
    concurrency:
      group: e2e-pr-${{ github.event.pull_request.number }}-ionic9-${{ matrix.shard }}
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Fail if tree verification failed
        if: needs.ci-reuse.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - run: npm ci --no-audit --no-fund
        working-directory: './demo'
      - name: Run Playwright tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=blob
        working-directory: ./demo
        env:
          IONIC_MAJOR: 9

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-ionic9-${{ matrix.shard }}
          path: demo/test-results/
          overwrite: true
          retention-days: 3

      - name: Upload Ionic 9 shard report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blob-report-ionic9-${{ matrix.shard }}
          path: demo/blob-report/
          overwrite: true
          retention-days: 3

  merge-reports:
    needs: test
    if: "!cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download Ionic 9 shards
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-ionic9-*
          merge-multiple: true
          path: blob-reports
      - name: Merge complete Ionic 9 results
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report/screenshot.spec.ts-ionic9.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          test "$(find blob-reports -name '*.zip' | wc -l)" -eq 2
          npm exec --yes --package=@playwright/test@1.58.2 -- playwright merge-reports --reporter=html,json blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-ionic9
          path: playwright-report/
          overwrite: true
          retention-days: 3
      - name: Upload merged JSON report
        uses: actions/upload-artifact@v5
        with:
          name: json-report-${{ github.event.pull_request.number }}
          path: report/screenshot.spec.ts-ionic9.json
          overwrite: true
          retention-days: 3

  comment-results:
    needs: merge-reports
    if: >-
      !cancelled() &&
      needs.merge-reports.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download JSON report
        uses: actions/download-artifact@v5
        with:
          name: json-report-${{ github.event.pull_request.number }}
          path: report

      - name: Comment PR with Ionic 9 test results
        uses: daun/playwright-report-comment@v3
        with:
          report-file: report/screenshot.spec.ts-ionic9.json
          job-summary: true
          custom-info: 'This result covers Ionic 9. To update the screenshots, comment with `/update-screenshots`.'

  deploy-report:
    needs: [test, merge-reports]
    concurrency:
      group: playwright-gh-pages
      cancel-in-progress: false
    if: >-
      !cancelled() &&
      (github.event.action == 'closed' || needs.merge-reports.result == 'success') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prune closed PR reports and check current head
        id: reports
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const openPulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const openNumbers = new Set(openPulls.map(pull => String(pull.number)));
            for (const entry of fs.readdirSync('gh-pages', { withFileTypes: true })) {
              const match = /^pr-(\d+)$/.exec(entry.name);
              if (entry.isDirectory() && match && !openNumbers.has(match[1])) {
                fs.rmSync(`gh-pages/${entry.name}`, { recursive: true });
                core.info(`Removed closed PR report: ${entry.name}`);
              }
            }
            const current = openPulls.find(pull => pull.number === context.payload.pull_request.number);
            core.setOutput('publish', context.payload.action !== 'closed' &&
              current?.head.sha === context.payload.pull_request.head.sha);

      - name: Download HTML report
        if: steps.reports.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: playwright-report-ionic9
          path: playwright-report

      - name: Replace current PR report
        if: steps.reports.outputs.publish == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf "gh-pages/pr-$PR_NUMBER"
          mkdir -p "gh-pages/pr-$PR_NUMBER"
          cp -R playwright-report/. "gh-pages/pr-$PR_NUMBER/"

      - name: Deploy reports and deletions to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Refresh open PR test reports'

      - name: Comment PR with report link
        if: steps.reports.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${prNumber}/`;

            const marker = '<!-- ionic9-playwright-report -->';
            const body = `${marker}\n` + `📊 **Ionic 9 Playwright Test Report**\n\nView the detailed Ionic 9 report after GitHub Pages deployment completes: ${reportUrl}\n\nView the results in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber
            });
            const reports = comments.filter(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.startsWith('📊 **Ionic 9 Playwright Test Report**'))
            );
            if (reports.length > 0) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: reports[0].id,
                body
              });
              for (const duplicate of reports.slice(1)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: duplicate.id
                });
              }
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body
              });
            }

  ci-reuse:
    name: Verify tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test CI reuse guards
        run: node --test .github/scripts/ci-tree-reuse.test.mjs
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
      - name: Reuse only the latest successful PR CI for this tree
        id: lookup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            const { resolveReuse } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            const result = await resolveReuse(github, context, process.env.TREE, 'e2e-pull_request.yml');
            core.setOutput('reuse', String(result.reuse));
            if (result.reuse) {
              await core.summary.addHeading('Reused PR validation').addLink('Latest successful PR CI', result.url)
                .addRaw(`\n\nComplete repository tree: ${result.tree}\n`).write();
            } else {
              core.info(result.reason);
            }
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
      - ci-reuse
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require executed tests or verified reuse
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          NEEDS: ${{ toJSON(needs) }}
          REUSE: ${{ needs.ci-reuse.outputs.reuse }}
        with:
          script: |
            const { requireResults } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            requireResults(process.env.REUSE === 'true', JSON.parse(process.env.NEEDS), ["test"], []);
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
      - name: Record PR checkout evidence
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-tree-pr-${{ github.event.pull_request.number }}-${{ steps.tree.outputs.tree }}-${{ steps.tree.outputs.commit
            }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree.txt
          if-no-files-found: error
          retention-days: 30
