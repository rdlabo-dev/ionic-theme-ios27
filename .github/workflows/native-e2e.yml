name: Native Simulator Tests

on:
  push:
    branches:
      - ci/native-e2e
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0' # Weekly, Monday 03:00 JST

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    timeout-minutes: 75
    # xcode-27 preview label; Xcode 27 beta is the default toolchain on that
    # image, so no DEVELOPER_DIR override is needed.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui-shell
            script: scripts/verify-native-ui-shell.sh
            kana: ''
          - suite: search
            script: scripts/verify-native-search.sh
            scenario: search
            kana: kana
          - suite: edge
            script: scripts/verify-native-search.sh
            scenario: edge
            kana: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: meta
        run: |
          xcodebuild -version
          echo "xcode_version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          echo "image_version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Restore incremental build products
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/native-${{ matrix.suite }}
          key: native-${{ matrix.suite }}-${{ steps.meta.outputs.xcode_version }}-${{ hashFiles('**/package-lock.json', 'ios/**', 'demo/ios/**', 'demo/native-*-fixture/**', 'src/**') }}
          restore-keys: |
            native-${{ matrix.suite }}-${{ steps.meta.outputs.xcode_version }}-

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - run: npm ci
      - run: npm ci
        working-directory: './demo'

      - name: Fetch shared simulator setup script
        run: |
          sha=$(jq -r '.packages["node_modules/@rdlabo/ionic-theme-utils"].resolved' package-lock.json | sed 's/.*#//')
          curl -fsSL "https://raw.githubusercontent.com/rdlabo-dev/ionic-theme-utils/$sha/scripts/ci-simulator.sh" -o "$RUNNER_TEMP/ci-simulator.sh"

      - name: Create and boot simulator
        run: sh "$RUNNER_TEMP/ci-simulator.sh" "iPhone 17" "iOS 27.0" ${{ matrix.kana }}

      - name: Run ${{ matrix.suite }} suite
        run: sh ${{ matrix.script }} "$SIM_UDID" ${{ matrix.scenario }}
        env:
          VERIFY_ARTIFACTS_DIR: ${{ runner.temp }}/native-${{ matrix.suite }}

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-${{ matrix.suite }}-screenshots
          path: |
            ${{ runner.temp }}/native-${{ matrix.suite }}/screenshots
            ${{ runner.temp }}/native-${{ matrix.suite }}/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload result bundle on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: native-${{ matrix.suite }}-xcresult
          path: ${{ runner.temp }}/native-${{ matrix.suite }}/tests.xcresult
          if-no-files-found: warn
          retention-days: 7
