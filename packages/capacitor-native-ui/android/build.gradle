ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "dev.rdlabo.capacitor.nativeui"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    // Acceptance app/assets must never enter a consuming application's debug build.
    if (project.hasProperty('nativeUIEngineIntegrationTest')) {
        sourceSets {
            debug {
                java.srcDirs += 'fixtures/debug/java'
                assets.srcDirs += ['fixtures/debug/assets', layout.buildDirectory.dir('generated/engine-fixture-assets').get().asFile]
                manifest.srcFile 'fixtures/debug/AndroidManifest.xml'
            }
            androidTest.java.srcDirs += 'fixtures/androidTest/java'
        }
    }
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '21' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    // Explicit local verification override; installed consumers resolve Maven normally.
    if (project.hasProperty('nativeUIEngineRepository')) maven { url = uri(project.property('nativeUIEngineRepository')) }
}

dependencies {
    def engineVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).dependencies['@rdlabo/capacitor-native-ui-engine']
    implementation "io.github.rdlabo:native-ui-engine:$engineVersion"
    api platform("androidx.compose:compose-bom:2025.10.00")
    api "androidx.compose.ui:ui"
    api "androidx.compose.foundation:foundation"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

if (project.hasProperty('nativeUIEngineIntegrationTest')) {
    def engineSource = file('../../capacitor-native-ui-engine/src')
    def fixtureBundle = layout.buildDirectory.file('generated/engine-fixture-assets/public/native-ui-engine.js')
    def bundleFixture = tasks.register('bundleNativeUIEngineFixture', Exec) {
        inputs.dir engineSource
        outputs.file fixtureBundle
        commandLine file('../../../node_modules/.bin/esbuild').absolutePath,
            new File(engineSource, 'index.ts').absolutePath, '--bundle', '--format=iife',
            '--global-name=NativeUIEngine', "--outfile=${fixtureBundle.get().asFile.absolutePath}"
    }
    tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn bundleFixture }
}
