<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="native-ui-engine.js"></script>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      background: repeating-linear-gradient(90deg, rgb(40, 80, 120) 0px 20px, rgb(180, 160, 60) 20px 40px);
    "
  >
    <div id="source" style="position: absolute; left: 20px; top: 100px; width: 160px; height: 64px"></div>
    <script>
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (condition, description) => {
        const deadline = performance.now() + 5000;
        while (!condition()) {
          if (performance.now() >= deadline) throw Error(description);
          await wait(10);
        }
      };
      const source = document.getElementById('source');
      const scope = NativeUIEngine.createWebProjectionScope(source, 'acceptance');
      const node = {
        id: 'fixture',
        kind: 'extension',
        x: 20,
        y: 100,
        width: 160,
        height: 64,
        extension: { name: 'engine.fixture', props: '{}', actions: {} },
      };
      let revision = 0;
      let delay = 0;
      let manager;
      let requests = Promise.resolve();
      let painted = 0;
      let restored = 0;
      let frame = 0;
      let syncing = false;
      let dirty = false;
      let stopped = false;
      let signature = '';
      let failure;
      // Delay native delivery of cover, preserving FIFO for BOTH snapshots and updates.
      const send = (method, options = {}) => {
        const response = requests.then(async () => {
          if (method === 'coveredSnapshot' && options.action === 'cover' && delay) await wait(delay);
          return Capacitor.nativePromise('NativeUI', method, options);
        });
        requests = response.catch(() => {});
        return response;
      };
      const reconcile = async () => {
        const controls = manager.owners.includes(source) ? [] : [node];
        const token = manager.token;
        const next = JSON.stringify([controls.map((control) => control.id), token]);
        if (next === signature) return;
        const result = await send('update', { revision: ++revision, viewportWidth: innerWidth, controls, coveredSnapshotToken: token });
        if (result.rejectedControls.length) throw Error('Native rendering rejected');
        signature = next;
        manager.updated(
          token,
          controls.map((control) => control.id),
          result.revision,
        );
        if (controls.length) manager.consider(result.revision, [{ element: source, control: node }]);
      };
      const wake = () => {
        if (stopped) return;
        dirty = true;
        if (frame || syncing) return;
        frame = requestAnimationFrame(async () => {
          frame = 0;
          if (manager.handoffPending) return;
          dirty = false;
          syncing = true;
          try {
            await reconcile();
          } catch (error) {
            failure = error;
          } finally {
            syncing = false;
            if (dirty) wake();
          }
        });
      };
      window.prepare = async () => {
        const capabilities = await send('configure');
        if (!capabilities.coveredSnapshots) throw Error('Snapshot capability missing');
        manager = await NativeUIEngine.createWebProjection(
          scope,
          {
            send: async (request) => {
              const result = await send('coveredSnapshot', request);
              if (request.action === 'painted') painted++;
              if (request.action === 'restored') restored++;
              return result ?? {};
            },
            listen: async (listener) => Capacitor.addListener('NativeUI', 'snapshotInteraction', listener),
          },
          { wake, blocked: () => false, revision: () => revision },
        );
        await reconcile();
        await until(() => source.hasAttribute('data-native-ui-snapshot'), 'Image preparation did not complete');
      };
      window.roundTrip = async (bridgeDelay) => {
        delay = bridgeDelay;
        const beforePaint = painted;
        manager.begin();
        await until(
          () => painted > beforePaint && source.hasAttribute('data-native-ui-snapshot-visible'),
          'Image handoff did not complete',
        );
        // Dwell lets PixelCopy sample each stable representation as well as both transfers.
        await wait(120);
        const beforeRestore = restored;
        manager.end();
        await until(
          () => restored > beforeRestore && !source.hasAttribute('data-native-ui-snapshot-visible'),
          'Native restoration did not complete',
        );
        await wait(120);
        if (failure) throw failure;
      };
      window.teardown = async () => {
        stopped = true;
        cancelAnimationFrame(frame);
        await manager.destroy();
        await requests;
        await send('clear', { revision: ++revision });
      };
    </script>
  </body>
</html>
