plugins {
    id 'com.android.library' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.20'
    id 'maven-publish'
}

group = 'io.github.rdlabo'
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version
android {
    namespace 'dev.rdlabo.capacitor.nativeuiengine'
    compileSdk 36
    defaultConfig {
        minSdk 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    publishing { singleVariant('release') { withSourcesJar(); withJavadocJar() } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'native-ui-engine'
                pom {
                    name = 'Capacitor Native UI Engine'
                    description = 'Native UI placement and Web projection for Capacitor plugin maintainers.'
                    url = 'https://github.com/rdlabo-dev/ionic-theme-ios27'
                    licenses { license { name = 'Zlib'; url = 'https://opensource.org/license/zlib' } }
                    developers { developer { id = 'rdlabo'; name = 'rdlabo'; url = 'https://github.com/rdlabo' } }
                    scm {
                        url = 'https://github.com/rdlabo-dev/ionic-theme-ios27'
                        connection = 'scm:git:https://github.com/rdlabo-dev/ionic-theme-ios27.git'
                        developerConnection = 'scm:git:ssh://git@github.com/rdlabo-dev/ionic-theme-ios27.git'
                    }
                }
            }
        }
        repositories { maven { name = 'verification'; url = layout.buildDirectory.dir('maven') } }
    }
}

if (providers.gradleProperty('signRelease').isPresent()) {
    apply plugin: 'signing'
    def key = providers.environmentVariable('MAVEN_SIGNING_KEY').orNull
    if (!key) throw new GradleException('MAVEN_SIGNING_KEY is required for signing')
    signing {
        useInMemoryPgpKeys(key, providers.environmentVariable('MAVEN_SIGNING_PASSWORD').getOrElse(''))
    }
    afterEvaluate { signing.sign(publishing.publications.release) }
}

tasks.register('centralBundle', Zip) {
    dependsOn 'publishReleasePublicationToVerificationRepository'
    from(layout.buildDirectory.dir('maven')) {
        include "io/github/rdlabo/native-ui-engine/${project.version}/**"
        exclude '**/maven-metadata*'
    }
    archiveFileName = "native-ui-engine-${project.version}-central.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    doFirst {
        if (!providers.gradleProperty('signRelease').isPresent()) {
            throw new GradleException('centralBundle requires -PsignRelease')
        }
    }
}

// Keep the package notices in binary and source distributions without duplicate source files.
def licenseResources = tasks.register('prepareLicenseResources', Sync) {
    from('..') { include 'LICENSE', 'NOTICE' }
    into(layout.buildDirectory.dir('generated/license-resources/META-INF/capacitor-native-ui-engine'))
}
android.sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/license-resources'))
tasks.matching { it.name.startsWith('process') && it.name.endsWith('JavaRes') }.configureEach { dependsOn licenseResources }
tasks.withType(Jar).configureEach {
    if (name in ['sourceReleaseJar', 'javaDocReleaseJar']) {
        from('..') { include 'LICENSE', 'NOTICE'; into 'META-INF/capacitor-native-ui-engine' }
    }
}

android.sourceSets.main.assets.srcDir('../ios/Sources/CapacitorNativeUIEngine/Resources')
