name: NativeToolbarTests
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  NativeToolbarTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeToolbarTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ionic.theme.toolbar.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  NativeToolbarTests:
    build:
      targets:
        NativeToolbarTests: [test]
    test:
      targets:
        - NativeToolbarTests
