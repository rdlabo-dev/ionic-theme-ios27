name: RangeProbe
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  RangeProbe:
    type: application
    platform: iOS
    sources: [App.swift]
    info:
      path: Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdlabo.rangeprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
  RangeProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdlabo.rangeprobe.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  RangeProbe:
    build:
      targets:
        RangeProbe: all
        RangeProbeTests: [test]
    test:
      targets: [RangeProbeTests]
