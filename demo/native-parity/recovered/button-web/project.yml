name: ButtonPressProbe
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  ButtonPressProbe:
    type: application
    platform: iOS
    sources:
      - App.swift
      - path: www
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdlabo.buttonpress.probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
  ButtonPressTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdlabo.buttonpress.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
    dependencies:
      - target: ButtonPressProbe
schemes:
  ButtonPressProbe:
    build:
      targets:
        ButtonPressProbe: all
        ButtonPressTests: [test]
    test:
      targets:
        - ButtonPressTests
