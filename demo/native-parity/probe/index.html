<!doctype html>
<html class="ios">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="entry.css" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      :root {
        --ion-color-primary: #0289ff;
        --ion-color-primary-rgb: 2, 137, 255;
        --ion-color-primary-contrast: #fff;
        --ion-color-primary-contrast-rgb: 255, 255, 255;
        --ion-color-primary-shade: #0279e0;
        --ion-color-primary-tint: #1b95ff;
        --ion-color-primary-brightness: #96feff;
      }
      body {
        margin: 0;
        background: #f2f2f7;
        font-family: -apple-system, sans-serif;
      }
      .ion-palette-dark body {
        background: #000;
      }
      #controls > * {
        position: absolute;
      }
      #controls > ion-button {
        left: 130px;
        top: 220px;
        width: 140px;
        height: 44px;
        margin: 0;
      }
      #controls > ion-button + ion-button {
        top: 370px;
      }
      ion-toggle {
        left: 150px;
        top: 220px;
      }
      ion-segment {
        left: 40px;
        top: 220px;
        width: 320px;
      }
      ion-range {
        left: 40px;
        top: 220px;
        width: 320px;
        height: 44px;
        padding: 0;
      }
      ion-tab-bar {
        left: 63px;
        top: 220px;
        width: 266px;
      }
      #controls ion-searchbar {
        left: 24px;
        top: 220px;
        width: 352px;
      }
      #controls > button {
        left: calc(50% - 80px);
        top: calc(50% - 22px);
        width: 160px;
        height: 44px;
      }
      /* Accessible test readiness marker, without contaminating comparison pixels. */
      #ready {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <ion-app>
      <div id="controls"></div>
      <div id="ready">Loading</div>
    </ion-app>
    <script src="entry.js"></script>
  </body>
</html>
