<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/main/index"></ion-back-button>
    </ion-buttons>
    <ion-title>searchbar</ion-title>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-list [inset]="true">
    <ion-item-group class="item-group-header">
      <ion-item>
        <ion-label>
          <ion-icon name="logo-ionic" style="background: linear-gradient(#489bfd, #2b77f4)"></ion-icon>
          <h2>searchbar</h2>
          <ion-header collapse="condense">
            <ion-toolbar></ion-toolbar>
          </ion-header>
          <ion-text><code>This page is a component demo for &#64;rdlabo/ionic-theme-ios27.</code></ion-text>
        </ion-label>
      </ion-item>
    </ion-item-group>
  </ion-list>

  <ion-toolbar><ion-searchbar></ion-searchbar></ion-toolbar>

  <ion-toolbar class="ios-theme-disabled">
    <ion-searchbar class="ios-theme-disabled"></ion-searchbar>
    <ion-buttons class="ios-theme-disabled" slot="end">
      <ion-button class="ios-theme-disabled">Search</ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="default">Search</ion-button>
    </ion-buttons>
    <ion-searchbar></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button fill="default">Search</ion-button>
    </ion-buttons>
    <ion-searchbar></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar class="searchbar-classic"></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar></ion-searchbar>
    <ion-buttons slot="end">
      <ion-button fill="default">Search</ion-button>
    </ion-buttons>
  </ion-toolbar>

  <section class="section-example">
    <ion-searchbar></ion-searchbar>
    <ion-searchbar placeholder="Custom Placeholder"></ion-searchbar>
    <ion-searchbar [disabled]="true" placeholder="Disabled"></ion-searchbar>
    <ion-searchbar [value]="'Value'"></ion-searchbar>
    <ion-searchbar [animated]="true" placeholder="Animated"></ion-searchbar>
    <!-- clearIcon is rendered by Ionic; no supportSeachbarCancelButtonIcon registration. -->
    <ion-searchbar
      [animated]="true"
      [clearIcon]="cancelIcon"
      show-clear-button="always"
      show-cancel-button="never"
      placeholder="Clear icon only"
    ></ion-searchbar>
    <ion-searchbar
      #nativeSearchbar
      [animated]="true"
      show-cancel-button="focus"
      [cancelButtonIcon]="cancelIcon"
      [clearIcon]="cancelIcon"
      placeholder="Cancel on focus"
    ></ion-searchbar>
    <ion-searchbar
      #nativeSearchbar
      [animated]="true"
      show-cancel-button="always"
      [cancelButtonIcon]="cancelIcon"
      [clearIcon]="cancelIcon"
      cancel-button-text="Close search"
      placeholder="Cancel always visible"
    ></ion-searchbar>
  </section>
</ion-content>
