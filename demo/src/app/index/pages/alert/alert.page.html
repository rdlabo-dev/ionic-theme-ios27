<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/main/index"></ion-back-button>
    </ion-buttons>
    <ion-title>alert</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-list [inset]="true">
    <ion-item-group class="item-group-header">
      <ion-item>
        <ion-label>
          <ion-icon name="logo-ionic" style="background: linear-gradient(#489bfd, #2b77f4)"></ion-icon>
          <h2>alert</h2>
          <ion-header collapse="condense">
            <ion-toolbar></ion-toolbar>
          </ion-header>
          <ion-text><code>This page is a component demo for &#64;rdlabo/ionic-theme-ios26.</code></ion-text>
        </ion-label>
      </ion-item>
    </ion-item-group>
  </ion-list>

  <ion-list [inset]="true">
    <ion-item-group>
      <ion-item (click)="present('preferred')" [button]="true">present:preferred</ion-item>
      <ion-item (click)="present('all')" [button]="true">present:all</ion-item>
      <ion-item (click)="present('button-only')" [button]="true">present:button-only</ion-item>
      <ion-item (click)="present('no-cancel')" [button]="true">present:no-cancel</ion-item>
      <ion-item (click)="present('remove-app')" [button]="true">present:remove-app</ion-item>
    </ion-item-group>
  </ion-list>
</ion-content>
