<div class="probe">
  <ion-button id="Glass" class="fixture-button">Glass</ion-button>
  <ion-button id="Prominent" class="fixture-button" fill="solid" [strong]="true">Prominent</ion-button>

  <ion-toggle id="Toggle" [checked]="true"></ion-toggle>

  <ion-segment id="Segment" value="one">
    <ion-segment-button value="one"><ion-label>One</ion-label></ion-segment-button>
    <ion-segment-button value="two"><ion-label>Two</ion-label></ion-segment-button>
    <ion-segment-button value="three"><ion-label>Three</ion-label></ion-segment-button>
  </ion-segment>

  <ion-range id="Range" [value]="40"></ion-range>

  <ion-tab-bar id="Tabs" selectedTab="one">
    <ion-tab-button tab="one"><ion-label>One</ion-label></ion-tab-button>
    <ion-tab-button tab="two"><ion-label>Two</ion-label></ion-tab-button>
    <ion-tab-button tab="three"><ion-label>Three</ion-label></ion-tab-button>
  </ion-tab-bar>
</div>
