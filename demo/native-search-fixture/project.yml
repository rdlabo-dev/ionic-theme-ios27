name: NativeUISearchTests
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  NativeUISearchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeUISearchTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ionic.theme.nativeui.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  NativeUISearchTests:
    build:
      targets:
        NativeUISearchTests: [test]
    test:
      targets:
        - NativeUISearchTests
