name: NativeUIEdgeTests
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  NativeUIEdgeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeUIEdgeTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ionic.theme.nativeui.edge.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  NativeUIEdgeTests:
    build:
      targets:
        NativeUIEdgeTests: [test]
    test:
      targets:
        - NativeUIEdgeTests
